[workspace]
resolver = "2"
members = [
    "apps/teams-gui",
    "crates/teams-api",
    "crates/teams-auth",
    "crates/teams-call",
    "crates/teams-notify",
    "crates/teams-protocol",
    "crates/teams-realtime",
    "crates/teams-store",
    "tools/teams-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["ms-teams-rs contributors"]
description = "Unofficial native Microsoft Teams client for Linux"
publish = false

# Central version pinning. Only crates actually referenced by a member are resolved;
# this table is the single place to bump versions.
[workspace.dependencies]
# --- async / runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"] }
futures = "0.3"
tokio-stream = "0.1"

# --- http / serialization ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
# Path-segment encoding for conversation ids (`:` `@` `;` are legal in the wire path,
# but `?` `#` `%` would break URL parsing — see teams-api `encode_path_segment`).
percent-encoding = "2"
# Correlation ids on the wire: UUIDv4 for the substrate search body (`cvid`/`logicalId`).
uuid = { version = "1", features = ["v4"] }

# --- error handling / logging ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- cli ---
clap = { version = "4", features = ["derive", "env"] }

# --- time ---
chrono = { version = "0.4", features = ["serde"] }

# --- testing ---
# Mock HTTP server for client tests (Phase 3 "unit tests with mocked HTTP" and the
# retry/401 paths of Phase 4).
wiremock = "0.6"

# --- local storage ---
rusqlite = { version = "0.37", features = ["bundled"] }

# --- desktop integration ---
# Desktop D-Bus. Default features intentionally kept: they select the async runtime
# integration and the crate does not build without one. v6 required: the v5 chain
# (zvariant/zvariant_derive/zbus_names) is unmaintained per RUSTSEC-2026-0370/0371/0372.
zbus = "6"

# --- internal crates (version must match workspace.package.version: keeps cargo-deny's
#     wildcard-ban happy — a path-only dep resolves to `*`) ---
teams-protocol = { version = "0.1.0", path = "crates/teams-protocol" }
teams-auth = { version = "0.1.0", path = "crates/teams-auth" }
teams-api = { version = "0.1.0", path = "crates/teams-api" }
teams-realtime = { version = "0.1.0", path = "crates/teams-realtime" }
teams-call = { version = "0.1.0", path = "crates/teams-call" }
teams-store = { version = "0.1.0", path = "crates/teams-store" }
teams-notify = { version = "0.1.0", path = "crates/teams-notify" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints we deliberately opt out of project-wide:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
# Keep build times sane despite the workspace.
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
